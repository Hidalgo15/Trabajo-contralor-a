name: APK de prueba

on:
  push:
    branches: [Dev_RonyVP, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.1"
          channel: stable
          cache: true

      # Baja el heap de Gradle: el android/gradle.properties del proyecto pide
      # 8G y el runner tiene menos.
      - name: Ajustar memoria de Gradle
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> ~/.gradle/gradle.properties

      - run: flutter pub get

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      # Publica el .apk directo en un release fijo, para poder bajarlo con un
      # link limpio (sin zip) cuando la descarga de artifacts esté bloqueada.
      - name: Publicar APK en release
        if: github.ref_name == 'Dev_RonyVP'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-dev
          name: APK de prueba (Dev_RonyVP)
          prerelease: true
          files: build/app/outputs/flutter-apk/app-debug.apk
