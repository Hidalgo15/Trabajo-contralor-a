name: consultas_y_contrataciones
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  path_provider: ^2.1.6
  open_file: ^4.0.0
  http: ^1.6.0
  webview_flutter: ^4.14.1
  intl: ^0.20.3

  # Generación de los PDF de Verifica CGR (trámite, contrato y consolidado).
  pdf: ^3.11.0
  # Hoja de compartir / imprimir del sistema: en móvil no hay carpeta de
  # descargas universal, así que "Descargar PDF" abre el share sheet.
  printing: ^5.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  # Habilitar carga de imágenes locales
  assets:
    - assets/logos/
    - assets/fonts/OFL-Bricolage.txt
    - assets/fonts/OFL-IBMPlex.txt

  # Tipografías del rediseño (empaquetadas para funcionar sin conexión).
  # Bricolage Grotesque e IBM Plex Sans son fuentes variables (eje wght);
  # Flutter mapea `fontWeight` al eje automáticamente.
  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans.ttf
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
